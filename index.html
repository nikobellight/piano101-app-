<!-- Piano 101 — index.html — v2.7 -->
<!-- v2.7: song title/subtitle/measure counter (#learning-shell-info) also
     moved into the app shell, next to the brand — same show/hide
     mechanism as the keyboard-mode switch. Practice/Restart buttons
     shrunk (.compact, .icon-btn) so the sticky bar fits one row.
     Requires css/app.css v2.5+ and js/view-learning.js v2.11+. -->
<!-- Piano 101 — index.html — v2.6 -->
<!-- v2.6: three changes per feedback.
     1. Keyboard-mode switch (1/2 keyboards) moved out of the sticky bar
        and into the persistent app shell, next to the profile switch —
        hidden there outside the Learning view (view-learning.js
        mount()/unmount()).
     2. Accompaniment is now a small dot toggle (.accompaniment-toggle)
        instead of a text button.
     3. Added #mini-hand-label ("Right"/"Both") next to the mini hands;
        the redundant hand mention in #context-subtitle text is dropped
        (view-learning.js).
     Requires css/app.css v2.4+ and js/view-learning.js v2.9+. -->
<!-- Piano 101 — index.html — v2.5 -->
<!-- v2.5: removed the big .hands-row entirely — Piano 101 header, then
     the sticky bar (with the mini hands right after Loop), then straight
     into the stage (canvas + keyboard), no intermediate row at all, per
     feedback. The mini hands in the sticky bar are the only hand
     illustration left; syncHandPanels()/updateFingerGuide() need no
     changes since they already select by class (.hand-dock/.hand-svg),
     not by which specific instance exists. -->
<!-- Piano 101 — index.html — v2.4 -->
<!-- v2.4: consolidated everything into the sticky bar per feedback — the
     old .learning-topbar / .learning-header / .practice-hud row (back
     link, song title, hand/section subtitle, measure counter, duplicate
     "Right hand" caption, keyboard-mode switch, accompaniment toggle)
     is gone. All of it now lives in .learning-sticky-bar, shrunk down,
     alongside the existing Start Practice/Play/Restart/tempo/Loop/hands.
     The redundant #finger-caption text is dropped entirely (removed
     from view-learning.js too, see v2.7). Requires css/app.css v2.3+ and
     js/view-learning.js v2.7+. -->
<!-- Piano 101 — index.html — v2.3 -->
<!-- v2.3: added mini hand illustrations (reusing .hand-dock/.hand-svg,
     sized down via .hand-dock-mini) to the sticky bar — same finger-guide
     highlighting as the big hands-row below the topbar, no JS changes
     needed since updateFingerGuide()/syncHandPanels() already select by
     class, not id. Requires css/app.css v2.2+ (.mini-hands,
     .hand-dock-mini). -->
<!-- Piano 101 — index.html — v2.2 -->
<!-- v2.2: added .learning-sticky-bar (Start/Stop Practice, Play, Restart,
     tempo, new #loop-btn) pinned to the top of the learning view on
     scroll — on tablet, these buttons used to require scrolling to reach.
     Removed from their old spots (.learning-header's .transport, and
     .practice-panel-left) now that they live in the sticky bar. Requires
     css/app.css v2.1+ (.learning-sticky-bar, .loop-btn) and
     js/view-learning.js v2.4+ (#loop-btn wiring). -->
<!-- Piano 101 — index.html — v2.1 -->
<!-- v2.1: file renamed from app.html to index.html as part of SPA
     consolidation — the old 3-page site (index/sections/learning.html)
     is retired. Content otherwise identical to app.html v2.0. -->
<!-- Piano 101 — app.html — v2.0 -->
<!-- v2.0: hands-row moved OUT of .stage entirely — it now sits above the
     whole stage (canvas + keyboard), not between them. The canvas now
     ends exactly at the keyboard, nothing in between, per feedback. -->
<!-- Piano 101 — app.html — v1.9 -->
<!-- v1.9: keyboard restored to its original full width (no longer shares
     its row with the hands — that broke note/key alignment since the
     canvas and the keyboard need to stay exactly the same width). Hands
     moved to their own dedicated row between the canvas and the keyboard,
     sharing its height with neither. Hand-drawn SVG replaced the emoji:
     each finger is its own elongated, well-separated shape, with its
     number written at the SAME coordinates as the finger tip in the
     SVG's own coordinate system, so it can't end up off the finger. -->
<!-- Piano 101 — app.html — v1.8 -->
<!-- v1.8: hands moved INTO the keyboard's own row (flex layout: left
     hand / keys / right hand, side by side) instead of being absolutely
     positioned outside it. The previous approach could end up entirely
     off-screen and unreachable on narrower viewports (no way to scroll
     into negative space) — this can't, by construction, on any width.
     Also: "2 linked" -> "2 keyboards" (the old label didn't read as an
     option alongside "1 keyboard"). -->
<!-- Piano 101 — app.html — v1.7 -->
<!-- v1.7: hands moved OFF the keyboard entirely — anchored just outside
     stage-inner's own box (immediately beside the keys, not over them),
     sized to the keyboard's own height. On narrow screens this can cause
     a horizontal scrollbar rather than the hands overlapping the keys,
     which is the accepted trade-off. -->
<!-- Piano 101 — app.html — v1.6 -->
<!-- v1.6: hand redesign #2 — the hand-drawn SVG (blocky bars, judged
     ugly) is replaced with a hand emoji (professionally illustrated) plus
     small colored number badges over the fingertips. Docked directly at
     the keyboard's own two corners (inside keyboard-wrap) instead of the
     wide stage margin, so they're always right beside the keys on any
     screen width — no more disappearing on narrower viewports. -->
<!-- Piano 101 — app.html — v1.5 -->
<!-- v1.5: tempo control (0.5x / 0.75x / 1x / 1.25x) in the practice HUD,
     plus a note under it that says when a slower run won't count toward
     the score — see view-learning.js v1.7. -->
<!-- Piano 101 — app.html — v1.4 -->
<!-- v1.4: hand redesign per feedback on the POP Piano reference screenshot
     — a single translucent shadow-hand per side (not the blocky bar
     design), with the finger number written ON the fingertip itself, no
     separate dot row. Docked in the stage's own side margins (outside
     stage-inner), so it structurally can never overlap the falling notes
     or the keys, and sits beside the keyboard as asked. Hidden below the
     width where that margin doesn't exist (see app.css).
     Also adds the score celebration modal (#score-modal): a vertical
     gauge, red at the bottom fading to green at the top, that fills to
     the section's score, plus a big percentage and Practice again / Back
     to sections actions. -->
<!-- v1.3: hands moved out of the HUD row and onto the stage itself —
     left hand bottom-left, right hand bottom-right, over the falling
     notes. Each shows a schematic hand plus numbered dots; the finger(s)
     due next light in their note colour, and a chord lights several at
     once. -->
<!-- v1.2: practice HUD above the stage — measure counter, finger guide
     (5 dots, the active one lit in the note's colour) and an
     accompaniment on/off toggle. The old SVG hand was dropped rather
     than restyled; five labelled dots read faster and don't fight the
     falling notes for attention. -->
<!-- v1.1: real profile names (Nicolas / Mia / Tenzin) instead of the
     Profile 1 / Profile 2 placeholders, and a 1-keyboard / 2-linked
     selector in the Learning view (MIDI 60-83 vs 48-95, matching the
     validated GPP-101 mappings). -->
<!-- v1.0: Single Page Application. Replaces index.html + sections.html +
     learning.html with one document holding three views, shown/hidden by
     a small hash router (js/router.js). The point: the page is NEVER
     reloaded, so the Web Bluetooth GATT connection to the GPP-101 stays
     alive across Dashboard -> Sections -> Learning navigation.
     The old 3 pages are left untouched in the repo during migration. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano 101</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/learning.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- App shell: shared by every view, rendered once, never destroyed.
       The BLE widget lives here so its GPP101 instance survives navigation. -->
  <header class="app-shell">
    <a class="brand" href="#/">
      <span class="brand-mark">Piano 101</span>
      <span class="brand-sub">Smart Practice</span>
    </a>
    <div id="learning-shell-info" class="sticky-song-info hidden">
      <span id="learning-song-title" class="sticky-song-title">Loading…</span>
      <span id="context-subtitle" class="context-subtitle"></span>
      <span class="sticky-measure">
        <span id="measure-value">–</span><span class="measure-sep">/</span><span id="measure-total">–</span>
      </span>
    </div>
    <div class="app-shell-right">
      <div id="keyboard-mode-switch" class="keyboard-mode-switch hidden">
        <button class="kbmode-btn" data-mode="solo">1 keyboard</button>
        <button class="kbmode-btn" data-mode="duo">2 keyboards</button>
      </div>
      <div id="ble-widget" class="ble-widget"></div>
      <div class="profile-switch">
        <button class="profile-btn" data-profile="1">Nicolas</button>
        <button class="profile-btn" data-profile="2">Mia</button>
        <button class="profile-btn" data-profile="3">Tenzin</button>
      </div>
    </div>
  </header>

  <!-- ============================ DASHBOARD ============================ -->
  <section id="view-dashboard" class="view">
    <div class="marquee">
      <div class="marquee-lane" id="marquee-lane"></div>
    </div>

    <main class="page">
      <h1 class="greeting">Hi there 👋</h1>
      <p class="greeting-sub">Here's where your practice stands.</p>

      <section class="ledger">
        <div class="ledger-entry">
          <div class="ledger-label">Hours practiced</div>
          <div class="ledger-value"><span id="stat-hours">0</span><span class="unit">h</span></div>
        </div>
        <div class="ledger-entry">
          <div class="ledger-label">Daily average</div>
          <div class="ledger-value"><span id="stat-avg">0</span><span class="unit">min</span></div>
        </div>
        <div class="ledger-entry">
          <div class="ledger-label">Songs in progress</div>
          <div class="ledger-value"><span id="stat-songs">0</span></div>
        </div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <h2 class="panel-title">
            Recently played
            <a href="#/">See all</a>
          </h2>
          <div id="recent-list"></div>
        </div>

        <div class="panel">
          <h2 class="panel-title">
            Library
            <a href="#/">Browse</a>
          </h2>
          <div id="library-preview"></div>

          <button class="action-btn" style="margin-top:16px;">
            <span class="action-text">
              Import a sound
              <div class="action-sub">Add a song from a file</div>
            </span>
            <span class="arrow">→</span>
          </button>
        </div>
      </section>
    </main>
  </section>

  <!-- ============================ SECTIONS ============================= -->
  <section id="view-sections" class="view">
    <main class="sections-page">
      <div class="sections-topbar">
        <a class="back-link" href="#/">&larr; Back to dashboard</a>
      </div>
      <h1 id="sections-song-title">Loading…</h1>

      <div id="hand-tabs" class="hand-tabs">
        <button class="hand-tab active" data-hand="right">🫱 Right</button>
        <button class="hand-tab" data-hand="both">🤲 Both</button>
      </div>

      <div id="section-grid" class="section-grid"></div>
    </main>
  </section>

  <!-- ============================ LEARNING ============================= -->
  <section id="view-learning" class="view">
    <main class="learning-page">
      <!-- Sticky bar: everything needed WHILE actually playing, so it's
           never a scroll away on tablet. position: sticky, stays pinned
           under the app-shell as the rest of the page scrolls under it. -->
      <div class="learning-sticky-bar">
        <a id="learning-back-link" class="back-link sticky-back" href="#/">&larr;</a>

        <button id="practice-btn" class="transport-btn primary compact">Practice</button>
        <button id="play-btn" class="transport-btn secondary compact">Play</button>
        <button id="restart-btn" class="transport-btn secondary compact icon-btn" title="Restart">&#9198;</button>
        <div id="tempo-switch" class="tempo-switch">
          <button class="tempo-btn" data-tempo="0.5">0.5x</button>
          <button class="tempo-btn" data-tempo="0.75">0.75x</button>
          <button class="tempo-btn active" data-tempo="1">1x</button>
          <button class="tempo-btn" data-tempo="1.25">1.25x</button>
        </div>
        <button id="loop-btn" class="loop-btn" aria-pressed="false">&#8635; Loop</button>

        <div class="mini-hands">
          <div class="hand-dock hand-dock-left hand-dock-mini">
            <svg class="hand-svg" data-hand="left" viewBox="0 0 170 230" aria-hidden="true">
              <rect class="palm" x="10" y="140" width="150" height="80" rx="30" />
              <g class="finger" data-finger="5">
                <rect x="22" y="65" width="22" height="82" rx="11" />
                <text x="33" y="90">5</text>
              </g>
              <g class="finger" data-finger="4">
                <rect x="50" y="38" width="22" height="109" rx="11" />
                <text x="61" y="63">4</text>
              </g>
              <g class="finger" data-finger="3">
                <rect x="78" y="15" width="22" height="132" rx="11" />
                <text x="89" y="40">3</text>
              </g>
              <g class="finger" data-finger="2">
                <rect x="106" y="40" width="22" height="107" rx="11" />
                <text x="117" y="65">2</text>
              </g>
              <g class="finger" data-finger="1">
                <rect x="134" y="95" width="22" height="52" rx="11" />
                <text x="145" y="120">1</text>
              </g>
            </svg>
          </div>

          <div class="hand-dock hand-dock-right hand-dock-mini">
            <svg class="hand-svg" data-hand="right" viewBox="0 0 170 230" aria-hidden="true">
              <rect class="palm" x="10" y="140" width="150" height="80" rx="30" />
              <g class="finger" data-finger="1">
                <rect x="14" y="95" width="22" height="52" rx="11" />
                <text x="25" y="120">1</text>
              </g>
              <g class="finger" data-finger="2">
                <rect x="42" y="40" width="22" height="107" rx="11" />
                <text x="53" y="65">2</text>
              </g>
              <g class="finger" data-finger="3">
                <rect x="70" y="15" width="22" height="132" rx="11" />
                <text x="81" y="40">3</text>
              </g>
              <g class="finger" data-finger="4">
                <rect x="98" y="38" width="22" height="109" rx="11" />
                <text x="109" y="63">4</text>
              </g>
              <g class="finger" data-finger="5">
                <rect x="126" y="65" width="22" height="82" rx="11" />
                <text x="137" y="90">5</text>
              </g>
            </svg>
          </div>

          <span id="mini-hand-label" class="mini-hand-label"></span>
        </div>

        <button id="accompaniment-btn" class="accompaniment-toggle" aria-pressed="true" title="Accompaniment">
          <span class="accompaniment-dot"></span>
          <span id="accompaniment-state">On</span>
        </button>
      </div>
      <div id="tempo-note" class="tempo-note"></div>

      <div class="stage">
        <div class="stage-inner">
          <canvas id="visualizer"></canvas>

          <div class="keyboard-wrap">
            <div id="keyboard"></div>
          </div>
        </div>
      </div>

      <div class="practice-panel">
        <div class="practice-panel-left">
          <span id="next-note-display" class="next-note"></span>
        </div>
        <div id="score-display" class="score-display"></div>
      </div>

      <!-- Score celebration — hidden by default, shown by showFinalScore().
           A vertical gauge (red at the bottom, green at the top) fills up
           to the score's own level; a dark mask covers the unfilled part
           and animates down to reveal it. -->
      <div id="score-modal" class="score-modal-backdrop hidden">
        <div class="score-modal-card">
          <div id="score-modal-kicker" class="score-modal-kicker">Section passed!</div>
          <div class="score-modal-body">
            <div class="score-gauge">
              <div class="score-gauge-track"></div>
              <div id="score-gauge-mask" class="score-gauge-mask"></div>
            </div>
            <div class="score-modal-figures">
              <div id="score-modal-pct" class="score-modal-pct">0%</div>
              <div id="score-modal-detail" class="score-modal-detail">clean run</div>
            </div>
          </div>
          <div id="score-confetti" class="score-confetti">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="score-modal-actions">
            <button id="score-modal-secondary" class="transport-btn secondary">Back to sections</button>
            <button id="score-modal-primary" class="transport-btn primary">Practice again</button>
          </div>
        </div>
      </div>
    </main>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.5.27/Tone.js"></script>


  <!-- Shared engine modules (unchanged from the multi-page version) -->
  <script src="js/keyboard-layout.js"></script>
  <script src="js/note-colors.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ble.js"></script>
  <script src="js/visualizer.js"></script>

  <!-- SPA plumbing -->
  <script src="js/store.js"></script>
  <script src="js/ble-shared.js"></script>
  <script src="js/view-dashboard.js"></script>
  <script src="js/view-sections.js"></script>
  <script src="js/view-learning.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
