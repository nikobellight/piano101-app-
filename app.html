<!-- Piano 101 — app.html — v1.7 -->
<!-- v1.7: hands moved OFF the keyboard entirely — anchored just outside
     stage-inner's own box (immediately beside the keys, not over them),
     sized to the keyboard's own height. On narrow screens this can cause
     a horizontal scrollbar rather than the hands overlapping the keys,
     which is the accepted trade-off. -->
<!-- Piano 101 — app.html — v1.6 -->
<!-- v1.6: hand redesign #2 — the hand-drawn SVG (blocky bars, judged
     ugly) is replaced with a hand emoji (professionally illustrated) plus
     small colored number badges over the fingertips. Docked directly at
     the keyboard's own two corners (inside keyboard-wrap) instead of the
     wide stage margin, so they're always right beside the keys on any
     screen width — no more disappearing on narrower viewports. -->
<!-- Piano 101 — app.html — v1.5 -->
<!-- v1.5: tempo control (0.5x / 0.75x / 1x / 1.25x) in the practice HUD,
     plus a note under it that says when a slower run won't count toward
     the score — see view-learning.js v1.7. -->
<!-- Piano 101 — app.html — v1.4 -->
<!-- v1.4: hand redesign per feedback on the POP Piano reference screenshot
     — a single translucent shadow-hand per side (not the blocky bar
     design), with the finger number written ON the fingertip itself, no
     separate dot row. Docked in the stage's own side margins (outside
     stage-inner), so it structurally can never overlap the falling notes
     or the keys, and sits beside the keyboard as asked. Hidden below the
     width where that margin doesn't exist (see app.css).
     Also adds the score celebration modal (#score-modal): a vertical
     gauge, red at the bottom fading to green at the top, that fills to
     the section's score, plus a big percentage and Practice again / Back
     to sections actions. -->
<!-- v1.3: hands moved out of the HUD row and onto the stage itself —
     left hand bottom-left, right hand bottom-right, over the falling
     notes. Each shows a schematic hand plus numbered dots; the finger(s)
     due next light in their note colour, and a chord lights several at
     once. -->
<!-- v1.2: practice HUD above the stage — measure counter, finger guide
     (5 dots, the active one lit in the note's colour) and an
     accompaniment on/off toggle. The old SVG hand was dropped rather
     than restyled; five labelled dots read faster and don't fight the
     falling notes for attention. -->
<!-- v1.1: real profile names (Nicolas / Mia / Tenzin) instead of the
     Profile 1 / Profile 2 placeholders, and a 1-keyboard / 2-linked
     selector in the Learning view (MIDI 60-83 vs 48-95, matching the
     validated GPP-101 mappings). -->
<!-- v1.0: Single Page Application. Replaces index.html + sections.html +
     learning.html with one document holding three views, shown/hidden by
     a small hash router (js/router.js). The point: the page is NEVER
     reloaded, so the Web Bluetooth GATT connection to the GPP-101 stays
     alive across Dashboard -> Sections -> Learning navigation.
     The old 3 pages are left untouched in the repo during migration. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano 101</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/learning.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- App shell: shared by every view, rendered once, never destroyed.
       The BLE widget lives here so its GPP101 instance survives navigation. -->
  <header class="app-shell">
    <a class="brand" href="#/">
      <span class="brand-mark">Piano 101</span>
      <span class="brand-sub">Smart Practice</span>
    </a>
    <div class="app-shell-right">
      <div id="ble-widget" class="ble-widget"></div>
      <div class="profile-switch">
        <button class="profile-btn" data-profile="1">Nicolas</button>
        <button class="profile-btn" data-profile="2">Mia</button>
        <button class="profile-btn" data-profile="3">Tenzin</button>
      </div>
    </div>
  </header>

  <!-- ============================ DASHBOARD ============================ -->
  <section id="view-dashboard" class="view">
    <div class="marquee">
      <div class="marquee-lane" id="marquee-lane"></div>
    </div>

    <main class="page">
      <h1 class="greeting">Hi there 👋</h1>
      <p class="greeting-sub">Here's where your practice stands.</p>

      <section class="ledger">
        <div class="ledger-entry">
          <div class="ledger-label">Hours practiced</div>
          <div class="ledger-value"><span id="stat-hours">0</span><span class="unit">h</span></div>
        </div>
        <div class="ledger-entry">
          <div class="ledger-label">Daily average</div>
          <div class="ledger-value"><span id="stat-avg">0</span><span class="unit">min</span></div>
        </div>
        <div class="ledger-entry">
          <div class="ledger-label">Songs in progress</div>
          <div class="ledger-value"><span id="stat-songs">0</span></div>
        </div>
      </section>

      <section class="grid-2">
        <div class="panel">
          <h2 class="panel-title">
            Recently played
            <a href="#/">See all</a>
          </h2>
          <div id="recent-list"></div>
        </div>

        <div class="panel">
          <h2 class="panel-title">
            Library
            <a href="#/">Browse</a>
          </h2>
          <div id="library-preview"></div>

          <button class="action-btn" style="margin-top:16px;">
            <span class="action-text">
              Import a sound
              <div class="action-sub">Add a song from a file</div>
            </span>
            <span class="arrow">→</span>
          </button>
        </div>
      </section>
    </main>
  </section>

  <!-- ============================ SECTIONS ============================= -->
  <section id="view-sections" class="view">
    <main class="sections-page">
      <div class="sections-topbar">
        <a class="back-link" href="#/">&larr; Back to dashboard</a>
      </div>
      <h1 id="sections-song-title">Loading…</h1>

      <div id="hand-tabs" class="hand-tabs">
        <button class="hand-tab active" data-hand="right">🫱 Right</button>
        <button class="hand-tab" data-hand="both">🤲 Both</button>
      </div>

      <div id="section-grid" class="section-grid"></div>
    </main>
  </section>

  <!-- ============================ LEARNING ============================= -->
  <section id="view-learning" class="view">
    <main class="learning-page">
      <div class="learning-topbar">
        <a id="learning-back-link" class="back-link" href="#/">&larr; Back to sections</a>
        <div id="keyboard-mode-switch" class="keyboard-mode-switch">
          <button class="kbmode-btn" data-mode="solo">1 keyboard</button>
          <button class="kbmode-btn" data-mode="duo">2 linked</button>
        </div>
      </div>

      <div class="learning-header">
        <div>
          <h1 id="learning-song-title">Loading…</h1>
          <div id="context-subtitle" class="context-subtitle"></div>
        </div>
        <div class="transport">
          <button id="restart-btn" class="transport-btn secondary">Restart</button>
          <button id="play-btn" class="transport-btn primary">Play</button>
        </div>
      </div>

      <div class="practice-hud">
        <div class="measure-pill">
          <span id="measure-value">–</span>
          <span class="measure-sep">/</span>
          <span id="measure-total">–</span>
          <span class="measure-caption">measure</span>
        </div>

        <div id="finger-caption" class="finger-caption">Right hand</div>

        <div id="tempo-switch" class="tempo-switch">
          <button class="tempo-btn" data-tempo="0.5">0.5x</button>
          <button class="tempo-btn" data-tempo="0.75">0.75x</button>
          <button class="tempo-btn active" data-tempo="1">1x</button>
          <button class="tempo-btn" data-tempo="1.25">1.25x</button>
        </div>

        <button id="accompaniment-btn" class="accompaniment-btn" aria-pressed="true">
          Accompaniment: on
        </button>
      </div>
      <div id="tempo-note" class="tempo-note"></div>

      <div class="stage">
        <div class="stage-inner">
          <canvas id="visualizer"></canvas>

          <div class="keyboard-wrap">
            <div id="keyboard"></div>
          </div>

          <!-- Hands are anchored just OUTSIDE stage-inner's own box now —
               fully off the keys, not overlapping them at all. Built from
               an emoji glyph (professionally illustrated, unlike the
               hand-drawn SVG attempt) with a small colored badge overlaid
               near each fingertip; the badge shows that finger's number
               when it's due. On narrow screens there's no room beside
               the keys without going off the edge of the page — that's
               allowed here (a horizontal scrollbar) rather than moving
               the hands back onto the keys. -->
          <div class="hand-dock hand-dock-left">
            <div class="hand-visual" data-hand="left">
              <div class="hand-emoji" aria-hidden="true">✋</div>
              <span class="finger-badge" data-finger="1"></span>
              <span class="finger-badge" data-finger="2"></span>
              <span class="finger-badge" data-finger="3"></span>
              <span class="finger-badge" data-finger="4"></span>
              <span class="finger-badge" data-finger="5"></span>
            </div>
          </div>

          <div class="hand-dock hand-dock-right">
            <div class="hand-visual" data-hand="right">
              <div class="hand-emoji" aria-hidden="true">✋</div>
              <span class="finger-badge" data-finger="1"></span>
              <span class="finger-badge" data-finger="2"></span>
              <span class="finger-badge" data-finger="3"></span>
              <span class="finger-badge" data-finger="4"></span>
              <span class="finger-badge" data-finger="5"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="practice-panel">
        <div class="practice-panel-left">
          <button id="practice-btn" class="transport-btn primary">Start Practice</button>
          <span id="next-note-display" class="next-note"></span>
        </div>
        <div id="score-display" class="score-display"></div>
      </div>

      <!-- Score celebration — hidden by default, shown by showFinalScore().
           A vertical gauge (red at the bottom, green at the top) fills up
           to the score's own level; a dark mask covers the unfilled part
           and animates down to reveal it. -->
      <div id="score-modal" class="score-modal-backdrop hidden">
        <div class="score-modal-card">
          <div id="score-modal-kicker" class="score-modal-kicker">Section passed!</div>
          <div class="score-modal-body">
            <div class="score-gauge">
              <div class="score-gauge-track"></div>
              <div id="score-gauge-mask" class="score-gauge-mask"></div>
            </div>
            <div class="score-modal-figures">
              <div id="score-modal-pct" class="score-modal-pct">0%</div>
              <div id="score-modal-detail" class="score-modal-detail">clean run</div>
            </div>
          </div>
          <div id="score-confetti" class="score-confetti">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="score-modal-actions">
            <button id="score-modal-secondary" class="transport-btn secondary">Back to sections</button>
            <button id="score-modal-primary" class="transport-btn primary">Practice again</button>
          </div>
        </div>
      </div>
    </main>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.5.27/Tone.js"></script>


  <!-- Shared engine modules (unchanged from the multi-page version) -->
  <script src="js/keyboard-layout.js"></script>
  <script src="js/note-colors.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ble.js"></script>
  <script src="js/visualizer.js"></script>

  <!-- SPA plumbing -->
  <script src="js/store.js"></script>
  <script src="js/ble-shared.js"></script>
  <script src="js/view-dashboard.js"></script>
  <script src="js/view-sections.js"></script>
  <script src="js/view-learning.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
