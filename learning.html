<!-- v4.2 -->
<!-- Piano 101 — learning.html — BASE + Sections + Wait Mode (Practice)
     Adds a Practice panel: Start/Stop Practice, a simple next-note
     indicator, and a score display. Practice runs off virtual keyboard
     clicks only for now — no BLE yet (next step), no hand illustration
     yet (later step). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano 101 · Learning Mode</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/learning.css" />
</head>
<body>

  <main class="learning-page">
    <a id="back-link" class="back-link" href="index.html">&larr; Back to sections</a>

    <div class="learning-header">
      <div>
        <h1 id="song-title">Loading…</h1>
        <div id="context-subtitle" class="context-subtitle"></div>
      </div>
      <div class="transport">
        <button id="restart-btn" class="transport-btn secondary">Restart</button>
        <button id="play-btn" class="transport-btn primary">Play</button>
      </div>
    </div>

    <div class="stage">
      <div class="stage-inner">
        <canvas id="visualizer"></canvas>
        <div class="keyboard-wrap">
          <div id="keyboard"></div>
        </div>
      </div>
    </div>

    <div class="practice-panel">
      <div class="practice-panel-left">
        <button id="practice-btn" class="transport-btn primary">Start Practice</button>
        <span id="next-note-display" class="next-note"></span>
      </div>
      <div id="score-display" class="score-display"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.5.27/Tone.js"></script>
  <script src="js/keyboard-layout.js"></script>
  <script src="js/note-colors.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/learning.js"></script>
</body>
</html>
